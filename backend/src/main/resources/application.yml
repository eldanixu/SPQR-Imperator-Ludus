spring:
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/spqr_db?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:spqr}
    password: ${SPRING_DATASOURCE_PASSWORD:spqr123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: spqr-secret-key-minimum-256-bits-for-hs256-algorithm-2024
    expiration: 86400000
  n8n:
    narrar-evento-url: http://spqr-n8n:5678/webhook/narrar-evento
